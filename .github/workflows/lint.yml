name: Lint

# ESLint gate for the frontend. Added after the linter was found to have been
# silently broken for a while (eslint-config-next 16 dropped eslintrc support
# and there was no CI job running `npm run lint`). Keep this a required check
# in branch protection ("Settings -> Branches -> main -> Require status checks
# -> ESLint") so a lint failure blocks the merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Generate Prisma client
        # Not connecting — `prisma generate` only reads the schema, but it needs
        # DATABASE_URL to be defined and produces @prisma/client so ESLint's
        # import/no-unresolved can resolve it.
        working-directory: frontend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
        run: npx prisma generate

      - name: Build icon CSS
        # Normally a postinstall step; skipped above by --ignore-scripts. ESLint's
        # import/no-unresolved needs this generated file, which layout.jsx imports.
        working-directory: frontend
        run: npm run build:icons

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Stylelint
        working-directory: frontend
        run: npm run lint:css

      - name: Strict type check
        # Strict-mode ratchet of the JS -> strict TS migration (roadmap#171):
        # tsc --strict against the debt in .strict-debt.json, no new JS file.
        working-directory: frontend
        run: npm run typecheck:strict

      - name: Console bundles match their sources
        # The console pop-outs are static pages that load committed bundles
        # (noVNC, xterm, spice-html5, console helpers). Rebuild them from the
        # lockfile and fail when the committed files differ, so a dependency
        # bump cannot leave the shipped bundle behind.
        working-directory: frontend
        run: |
          npm run build:bundles
          drift=$(git status --porcelain -- public/novnc public/xterm public/spice public/console)
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::Committed console bundles differ from a rebuild: run npm run build:bundles and commit the result."
            exit 1
          fi
