name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  # ========================================
  # Trivy: Scan Docker images for vulns
  # ========================================
  trivy-frontend:
    name: Trivy — Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Frontend image (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: proxcenter-frontend:scan
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy on Frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'proxcenter-frontend:scan'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          # Without this flag the SARIF output carries every severity and
          # the filter above only applies to the table format.
          limit-severities-for-sarif: true
          # The image's node_modules come from package-lock.json, which
          # trivy-fs already scans: reporting them here too doubles every
          # npm alert. This job only covers the Alpine packages.
          vuln-type: 'os'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: success() || (failure() && hashFiles('trivy-frontend.sarif') != '')
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'trivy-frontend'

  trivy-orchestrator:
    if: github.actor != 'dependabot[bot]'
    name: Trivy — Orchestrator Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout backend repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: adminsyspro/proxcenter-backend
          ref: main
          path: backend
          token: ${{ secrets.ORCHESTRATOR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Orchestrator image (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: proxcenter-orchestrator:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy on Orchestrator image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'proxcenter-orchestrator:scan'
          format: 'sarif'
          output: 'trivy-orchestrator.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: success() || (failure() && hashFiles('trivy-orchestrator.sarif') != '')
        with:
          sarif_file: 'trivy-orchestrator.sarif'
          category: 'trivy-orchestrator'

  # ========================================
  # Trivy: Scan filesystem (deps + secrets)
  # ========================================
  trivy-fs:
    name: Trivy — Filesystem (deps + secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,secret'
          limit-severities-for-sarif: true

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-filesystem'

  # ========================================
  # zizmor: GitHub Actions workflows
  # ========================================
  zizmor:
    name: zizmor — Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        env:
          ZIZMOR_VERSION: 1.31.1
          ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zizmor.tar.gz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP" zizmor

      # Findings go to code scanning, where a pull request sees the ones it
      # adds. The token lets the online audits (known vulnerable actions,
      # impostor commits) resolve the pinned SHAs.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/zizmor" --format sarif --no-exit-codes .github/workflows > zizmor.sarif

      - name: Upload zizmor results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: success() || (failure() && hashFiles('zizmor.sarif') != '')
        with:
          sarif_file: 'zizmor.sarif'
          category: 'zizmor'
