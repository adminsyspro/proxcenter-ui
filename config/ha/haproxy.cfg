global
    maxconn 4096
    user haproxy
    group haproxy

defaults
    mode tcp
    timeout connect 3s
    timeout client 30s
    timeout server 30s

# Hardened layout (security level 1): /tls is config/ha/tls, mounted
# read-only. Patroni's REST API (8008) and the orchestrators of the peers
# (8080) are reached over TLS, verified against the cluster CA.
frontend pg_frontend
    bind 127.0.0.1:5432
    maxconn 256
    default_backend pg_backend

backend pg_backend
    option httpchk GET /primary
    http-check expect status 200

    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions

    server proxcenter-1 PEER1_IP:5432 check port 8008 check-ssl verify required ca-file /tls/ca.crt
    server proxcenter-2 PEER2_IP:5432 check port 8008 check-ssl verify required ca-file /tls/ca.crt
    server proxcenter-3 PEER3_IP:5432 check port 8008 check-ssl verify required ca-file /tls/ca.crt

# Leader proxy: forwards DRS metrics/recommendations traffic to whichever
# orchestrator currently holds leadership. Exactly one node answers 200 on
# /api/v1/leader, so the frontend's ORCHESTRATOR_LEADER_URL always reaches the
# node whose in-memory DRS state is populated, regardless of which node holds
# the VIP (ui#803, defect 2). Uses /api/v1/leader, never /health (keepalived
# tracks /health).
frontend orch_leader_frontend
    bind 127.0.0.1:8081
    default_backend orch_leader_backend

backend orch_leader_backend
    option httpchk GET /api/v1/leader
    http-check expect status 200

    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions

    server proxcenter-1 PEER1_IP:8080 ssl verify required ca-file /tls/ca.crt crt /tls/client.pem check
    server proxcenter-2 PEER2_IP:8080 ssl verify required ca-file /tls/ca.crt crt /tls/client.pem check
    server proxcenter-3 PEER3_IP:8080 ssl verify required ca-file /tls/ca.crt crt /tls/client.pem check

# Orchestrator API of this node for its peers: the orchestrator itself only
# listens on 127.0.0.1:8080; HAProxy publishes it on NODE_IP:8080 (the same
# port as before, no firewall rule to change) and admits only clients that
# present a certificate signed by the cluster CA.
frontend orch_mtls_frontend
    bind NODE_IP:8080 ssl crt /tls/node.pem ca-file /tls/ca.crt verify required
    default_backend orch_local_backend

backend orch_local_backend
    server local 127.0.0.1:8080
