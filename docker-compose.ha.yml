# docker-compose.ha.yml
#
# Per-node HA compose for the ProxCenter 3-node cluster.
# Each VM runs this same file with node-specific .env values.
# Every image is prebuilt and pulled from ghcr.io (see the docker-publish
# workflow): the conversion never runs `docker build` on a customer node,
# and nodes only need ghcr.io egress.
# See docs/ha/prerequisites.md and docs/ha/conversion-runbook.md.
#
# Hardened layout (security level 1): etcd, Patroni, PostgreSQL and the
# orchestrator API between nodes all use TLS signed by the cluster CA
# (config/ha/tls, generated by the orchestrator), the application connects
# as proxcenter_app, and no container gets extra privileges.

services:
  # ── Layer 0: distributed consensus ──────────────────────────────
  etcd:
    image: ${REGISTRY:-ghcr.io/adminsyspro}/etcd:v3.5.17
    network_mode: host
    restart: unless-stopped
    volumes:
      - etcd_data:/var/lib/etcd
      - ./config/ha/tls:/etc/etcd/tls:ro
    environment:
      ETCD_NAME: ${NODE_NAME}
      ETCD_DATA_DIR: /var/lib/etcd
      ETCD_LISTEN_PEER_URLS: https://${NODE_IP}:2380
      ETCD_LISTEN_CLIENT_URLS: https://${NODE_IP}:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://${NODE_IP}:2380
      ETCD_ADVERTISE_CLIENT_URLS: https://${NODE_IP}:2379
      ETCD_INITIAL_CLUSTER: proxcenter-1=https://${PEER1_IP}:2380,proxcenter-2=https://${PEER2_IP}:2380,proxcenter-3=https://${PEER3_IP}:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_AUTO_COMPACTION_MODE: periodic
      ETCD_AUTO_COMPACTION_RETENTION: "1h"
      # Mutual TLS on both ports: clients (Patroni, the orchestrator) and
      # peers must present a certificate signed by the cluster CA.
      ETCD_CERT_FILE: /etc/etcd/tls/node.crt
      ETCD_KEY_FILE: /etc/etcd/tls/node.key
      ETCD_TRUSTED_CA_FILE: /etc/etcd/tls/ca.crt
      ETCD_PEER_CERT_FILE: /etc/etcd/tls/node.crt
      ETCD_PEER_KEY_FILE: /etc/etcd/tls/node.key
      ETCD_PEER_TRUSTED_CA_FILE: /etc/etcd/tls/ca.crt
      ETCD_CLIENT_CERT_AUTH: "true"
      ETCD_PEER_CLIENT_CERT_AUTH: "true"

  # ── Layer 1: Postgres managed by Patroni ────────────────────────
  patroni:
    image: ${REGISTRY:-ghcr.io/adminsyspro}/proxcenter-patroni:${VERSION:-latest}
    network_mode: host
    restart: unless-stopped
    # No extra privileges: Patroni runs as postgres and the default Docker
    # capabilities cover the entrypoint's chown/chmod/su-exec. The watchdog
    # is off; enabling it one day means a devices: /dev/watchdog entry.
    # Fresh /tmp on every (re)start so the entrypoint can always re-render
    # /tmp/patroni.yml. A persisted postgres-owned copy otherwise blocks the
    # root entrypoint's rewrite on a warm restart and crash-loops the node.
    tmpfs:
      - /tmp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/ha/patroni.yml:/etc/patroni/patroni.yml:ro
      - ./config/ha/tls:/etc/patroni/tls:ro
    environment:
      PATRONI_NAME: ${NODE_NAME}
      PATRONI_SCOPE: proxcenter
      # Credentials flow through Patroni's documented environment variables,
      # never through envsubst into patroni.yml: envsubst cannot quote
      # arbitrary YAML values, so any printable password must stay an env var.
      PATRONI_SUPERUSER_USERNAME: ${POSTGRES_USER:-proxcenter}
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
      # Dedicated replication and rewind roles, over TLS verified by the CA.
      PATRONI_REPLICATION_USERNAME: ${REPLICATION_USER}
      PATRONI_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      PATRONI_REPLICATION_SSLMODE: verify-ca
      PATRONI_REPLICATION_SSLROOTCERT: /etc/patroni/tls/ca.crt
      PATRONI_REWIND_USERNAME: proxcenter_rewind
      PATRONI_REWIND_PASSWORD: ${REWIND_PASSWORD}
      PATRONI_REWIND_SSLMODE: verify-ca
      PATRONI_REWIND_SSLROOTCERT: /etc/patroni/tls/ca.crt
      # REST API over HTTPS with the node certificate; write endpoints need
      # these credentials (GET endpoints stay open for HAProxy checks).
      PATRONI_RESTAPI_USERNAME: patroni
      PATRONI_RESTAPI_PASSWORD: ${PATRONI_REST_PASSWORD}
      PATRONI_RESTAPI_CERTFILE: /etc/patroni/tls/node.crt
      PATRONI_RESTAPI_KEYFILE: /etc/patroni/tls/node.key
      PATRONI_RESTAPI_CAFILE: /etc/patroni/tls/ca.crt
      PATRONI_CTL_USERNAME: patroni
      PATRONI_CTL_PASSWORD: ${PATRONI_REST_PASSWORD}
      PATRONI_CTL_CERTFILE: /etc/patroni/tls/node.crt
      PATRONI_CTL_KEYFILE: /etc/patroni/tls/node.key
      PATRONI_CTL_CACERT: /etc/patroni/tls/ca.crt
      # etcd client over mutual TLS.
      PATRONI_ETCD3_PROTOCOL: https
      PATRONI_ETCD3_CACERT: /etc/patroni/tls/ca.crt
      PATRONI_ETCD3_CERT: /etc/patroni/tls/node.crt
      PATRONI_ETCD3_KEY: /etc/patroni/tls/node.key
      NODE_IP: ${NODE_IP}
      PEER1_IP: ${PEER1_IP}
      PEER2_IP: ${PEER2_IP}
      PEER3_IP: ${PEER3_IP}
      # REST API allowlist and pg_hba entries (patroni.yml).
      VIP: ${VIP}
      PGDATA: /var/lib/postgresql/data
      # psql client user for the entrypoint's replication-role check (local
      # socket only). No PGPASSWORD here: libpq would prefer it to the
      # passfile Patroni writes for the replication and rewind connections,
      # and send the superuser password for proxcenter_repl/proxcenter_rewind.
      PGUSER: ${POSTGRES_USER:-proxcenter}
    depends_on:
      etcd:
        condition: service_started

  # ── Layer 2: local PG proxy ─────────────────────────────────────
  haproxy:
    image: ${REGISTRY:-ghcr.io/adminsyspro}/haproxy:2.9-alpine
    network_mode: host
    restart: unless-stopped
    # Root reads the 0640 root:70 TLS keys. Master-worker mode (-W) keeps a
    # reload hitless (USR2).
    user: "0"
    entrypoint: ["/bin/sh", "-c", "sed 's/PEER1_IP/${PEER1_IP}/g; s/PEER2_IP/${PEER2_IP}/g; s/PEER3_IP/${PEER3_IP}/g; s/NODE_IP/${NODE_IP}/g' /usr/local/etc/haproxy/haproxy.cfg.template > /tmp/haproxy.cfg && exec haproxy -W -f /tmp/haproxy.cfg"]
    environment:
      NODE_IP: ${NODE_IP}
      PEER1_IP: ${PEER1_IP}
      PEER2_IP: ${PEER2_IP}
      PEER3_IP: ${PEER3_IP}
    volumes:
      - ./config/ha/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg.template:ro
      - ./config/ha/tls:/tls:ro
    depends_on:
      patroni:
        condition: service_started

  # ── Layer 3: application ────────────────────────────────────────
  frontend:
    image: ${REGISTRY:-ghcr.io/adminsyspro}/proxcenter-frontend:${VERSION:-latest}
    network_mode: host
    restart: unless-stopped
    volumes:
      # Branding / white-label / login-background uploads. Legacy on-disk
      # assets are imported into Postgres at boot (instrumentation hook);
      # the volume stays mounted so a converted node 1 keeps serving them.
      - proxcenter_data:/app/data
      - ./config/ha/tls:/app/ha-tls:ro
    environment:
      # Application role (not the superuser), TLS verified against the
      # cluster CA. POSTGRES_PASSWORD never reaches this container.
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-proxcenter}?schema=public&sslmode=verify-ca&sslrootcert=/app/ha-tls/ca.crt
      PGSSLROOTCERT: /app/ha-tls/ca.crt
      # Preserved external URL for FQDN / reverse-proxy / OIDC installs;
      # fresh IP-only installs fall back to the VIP.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://${VIP}:3000}
      # The same public URL, under the name the rest of the application reads.
      # Without it the container simply has no APP_URL, and the HTTPS tab's
      # coherence check could never be satisfied on an HA install however the
      # host .env was edited.
      APP_URL: ${APP_URL:-${NEXTAUTH_URL:-http://${VIP}:3000}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      APP_SECRET: ${APP_SECRET}
      # Built-in HTTPS. With network_mode: host there is no ports: mapping to
      # parametrize (unlike docker-compose.community.yml / .enterprise.yml):
      # whatever the app listens on inside the container is already the port
      # used on the host, so only the app-facing variables apply here.
      # TLS_PORT: port the HTTPS listener binds to. TLS_ENABLED: read once, on
      # the very first boot, to seed the setting; afterwards /settings is the
      # source of truth.
      TLS_PORT: ${TLS_PORT:-8443}
      TLS_ENABLED: ${TLS_ENABLED:-false}
      ORCHESTRATOR_URL: http://127.0.0.1:8080
      # DRS metrics/recommendations go through HAProxy to the leader orchestrator
      # (ui#803, defect 2); everything else stays on the local orchestrator above.
      ORCHESTRATOR_LEADER_URL: http://127.0.0.1:8081
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY}
      PROXCENTER_REPORTING_URL: http://127.0.0.1:5000
      PG_POOL_MAX: ${PG_POOL_MAX:-}
      # Session lifetimes, in seconds. Left empty on purpose: the frontend
      # then applies its defaults, 12 hours of inactivity and 7 days absolute.
      # A malformed value falls back to those defaults rather than to no limit.
      # Set the same value on every node, a session must not outlive a failover.
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-}
      SESSION_ABSOLUTE_TIMEOUT: ${SESSION_ABSOLUTE_TIMEOUT:-}
      # Cloud image catalog: point TEMPLATE_CATALOG_URL at an internal mirror,
      # or set TEMPLATE_CATALOG_AUTO_UPDATE=false on an air-gapped install.
      TEMPLATE_CATALOG_URL: ${TEMPLATE_CATALOG_URL:-}
      TEMPLATE_CATALOG_AUTO_UPDATE: ${TEMPLATE_CATALOG_AUTO_UPDATE:-}
      # Air-gapped instance: no version check, no GitHub badge, no catalog
      # refresh, and the maps say why they cannot show tiles. Written by
      # install-airgap.sh; leave empty on a connected site.
      PROXCENTER_OFFLINE: ${PROXCENTER_OFFLINE:-}
      # Outbound HTTP proxy, written by the installer when it runs behind one.
      # The frontend only uses it for the calls to the SSO identity provider
      # (discovery, token, keys, sign-out), and only when no proxy is set in
      # Settings > OIDC / SSO. Proxmox and the internal services stay direct.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,frontend,postgres,orchestrator,weasyprint}
      # Shared secret for the first-run setup endpoint, which is reachable
      # without authentication for as long as no account exists. Empty keeps
      # the historical behaviour. A converted cluster already has accounts, so
      # this only matters on a stack built as HA from the start.
      PROXCENTER_SETUP_TOKEN: ${PROXCENTER_SETUP_TOKEN:-}
      # PROXCENTER_INSTANCE_ID is deliberately unset: with host networking the
      # container inherits the node hostname, which is exactly what the
      # orphaned-migration sweep needs (unique per node, stable across container
      # recreation). Never give two nodes the same value: a boot would fail its
      # live peers' migration jobs (#608).
      HA_ENABLED: "true"
      VIP: ${VIP}
      HA_REDIRECT_DISABLED: ${HA_REDIRECT_DISABLED:-}
      HA_REDIRECT_EXEMPT_HOSTS: ${HA_REDIRECT_EXEMPT_HOSTS:-}
      # Proxmox API budgets in milliseconds. Empty keeps the defaults: 8000 for
      # a regular call, 30000 for the reads that enumerate every storage.
      PVE_TIMEOUT_MS: ${PVE_TIMEOUT_MS:-}
      PVE_SLOW_READ_TIMEOUT_MS: ${PVE_SLOW_READ_TIMEOUT_MS:-}
      # How long a cold migration waits for an operator to pick the root
      # filesystem before it gives the node temp storage back. Default: 2 hours.
      V2V_ROOT_CHOICE_TIMEOUT_MS: ${V2V_ROOT_CHOICE_TIMEOUT_MS:-}
    healthcheck:
      # Liveness on purpose: /api/health (readiness) returns 503 while the
      # DB is unreachable, which would flap the container during failover.
      # Keepalived's track_script owns readiness (config/ha/track_script.sh).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      haproxy:
        condition: service_started

  orchestrator:
    image: ${REGISTRY:-ghcr.io/adminsyspro}/proxcenter-orchestrator:${VERSION:-latest}
    network_mode: host
    restart: unless-stopped
    volumes:
      - orchestrator_data:/app/data
      - proxcenter_data:/app/shared_data:ro
      - ./config/ha/tls:/app/ha-tls:ro
    environment:
      # Application role over TLS verified against the cluster CA.
      PROXCENTER_DATABASE_DSN: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-proxcenter}?sslmode=verify-ca&sslrootcert=/app/ha-tls/ca.crt
      PROXCENTER_API_API_KEY: ${ORCHESTRATOR_API_KEY}
      # Loopback only (config key api.address): the peers reach this API
      # through HAProxy on NODE_IP:8080, in mutual TLS (config/ha/haproxy.cfg).
      PROXCENTER_API_ADDRESS: 127.0.0.1:8080
      PROXCENTER_PROXMOX_APP_SECRET: ${APP_SECRET}
      PROXCENTER_REPORTING_URL: http://127.0.0.1:5000
      # CVE scanner sources. Empty keeps the public Debian hosts; an
      # air-gapped site points both at internal mirrors (see the air-gapped
      # installation guide).
      PROXCENTER_CVE_FEED_URL: ${CVE_FEED_URL:-}
      PROXCENTER_CVE_DEBIAN_MIRROR: ${CVE_DEBIAN_MIRROR:-}
      # Air-gapped instance: the orchestrator never calls proxcenter.io (no
      # portal connection, no check-in). Written by install-airgap.sh.
      PROXCENTER_OFFLINE: ${PROXCENTER_OFFLINE:-}
      LICENSE_KEY: ${LICENSE_KEY:-}
      TZ: ${TZ:-Europe/Paris}
      # sFlow collector: with host networking, UDP 6343 is reachable
      # directly on the node (no ports: mapping needed).
      PROXCENTER_SFLOW_ENABLED: "true"
      PROXCENTER_SFLOW_LISTEN_ADDRESS: 0.0.0.0:6343
      # Outbound HTTP proxy (CVE feeds, portal), from .env. Empty keeps
      # direct connections. Proxmox and the HA probes of the cluster nodes
      # never go through it.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,frontend,postgres,orchestrator,weasyprint}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      frontend:
        condition: service_healthy

  weasyprint:
    image: ${REGISTRY:-ghcr.io/adminsyspro}/proxcenter-weasyprint:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"

  # ── Layer 4: VIP management ──────────────────────────────────────
  keepalived:
    image: ${REGISTRY:-ghcr.io/adminsyspro}/proxcenter-keepalived:${VERSION:-latest}
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    # Fresh /run on every (re)start: keepalived's pid files otherwise survive
    # an unclean stop in the writable layer and crash-loop the restart with
    # "daemon is already running", so the node never holds the VIP again.
    tmpfs:
      - /run
    volumes:
      - ./config/ha/keepalived.conf:/etc/keepalived/keepalived.conf.template:ro
      - ./config/ha/track_script.sh:/etc/keepalived/track_script.sh:ro
      # CA for the HTTPS Patroni probe of track_script.sh.
      - ./config/ha/tls:/etc/keepalived/tls:ro
    environment:
      NODE_IP: ${NODE_IP}
      PEER1_IP: ${PEER1_IP}
      PEER2_IP: ${PEER2_IP}
      PEER3_IP: ${PEER3_IP}
      VIP: ${VIP}
      VIP_INTERFACE: ${VIP_INTERFACE:-eth0}
      VIP_PREFIX: ${VIP_PREFIX:-24}
      VRRP_PRIORITY: ${VRRP_PRIORITY:-100}
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  etcd_data:
  postgres_data:
    name: postgres_data
  orchestrator_data:
    name: orchestrator_data
  proxcenter_data:
    name: proxcenter_data
