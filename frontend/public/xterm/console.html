<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node Shell</title>
  <!-- xterm.js, bundled locally: an on-premise install has no CDN. -->
  <link rel="stylesheet" href="/xterm/xterm.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c0c0c;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; background: #1a1a1a; border-bottom: 1px solid #333;
      flex-shrink: 0; flex-wrap: nowrap;
    }
    /* Une seule ligne, toujours: le nom du nœud cède avant les boutons. */
    #toolbar .info { display: flex; align-items: center; gap: 12px; min-width: 120px; flex: 1 100 auto; overflow: hidden; }
    #status-dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; flex-shrink: 0; }
    #status-dot.connected { background: #22c55e; }
    #status-dot.connecting { background: #f59e0b; }
    #status-dot.error { background: #ef4444; }
    #console-type {
      background: #22c55e; color: #fff; padding: 2px 8px;
      border-radius: 4px; font-size: 11px; font-weight: 600; flex-shrink: 0;
    }
    #node-info { color: #fff; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    #status-text { color: #666; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex-shrink: 100; }
    #toolbar .buttons { display: flex; gap: 6px; align-items: center; min-width: 0; }
    #toolbar .buttons button { flex-shrink: 0; }
    button {
      padding: 6px 12px; font-size: 12px; background: #333; color: #fff;
      border: 1px solid #444; border-radius: 4px; cursor: pointer;
    }
    button:hover { background: #444; }
    button:disabled { background: #222; color: #666; cursor: not-allowed; }
    #toolbar .buttons button.icon { padding: 6px 9px; font-size: 14px; line-height: 1; }
    #toolbar .buttons button.active { background: #1e3a8a; border-color: #3b82f6; }
    #error-bar {
      padding: 12px 16px; background: #7f1d1d; color: #fecaca; font-size: 13px; display: none;
    }
    #error-bar.visible { display: block; }
    #terminal-container { flex: 1; width: 100%; background: #0c0c0c; position: relative; padding: 4px; overflow: hidden; }
    #terminal-container .xterm { height: 100%; }
    #terminal { height: 100%; }
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: #666;
    }
    #loading .icon { font-size: 48px; margin-bottom: 16px; }
    #loading .text { font-size: 14px; }
    #loading .subtext { font-size: 12px; margin-top: 8px; color: #555; }
    /* Plein écran: même comportement que les consoles graphiques, la barre
       quitte le flux et revient au bord haut, donc Close et Reconnect restent
       à un geste. */
    body.fs #toolbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20; opacity: 0.97;
      transform: translateY(-100%); transition: transform 0.18s ease;
    }
    body.fs #toolbar.peek, body.fs #toolbar:hover { transform: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <div class="info">
        <span id="status-dot"></span>
        <span id="console-type">xterm.js</span>
        <span id="node-info">Shell</span>
        <span id="status-text">• Initializing...</span>
      </div>
      <div class="buttons">
        <button id="btn-fullscreen" class="icon" title="Fullscreen">&#9974;</button>
        <button id="btn-reconnect">Reconnect</button>
        <button id="btn-close">Close</button>
      </div>
    </div>
    <div id="error-bar"></div>
    <div id="terminal-container">
      <div id="loading">
        <div class="icon">💻</div>
        <div class="text" id="loading-text">Loading...</div>
        <div class="subtext" id="loading-subtext"></div>
      </div>
      <div id="terminal"></div>
    </div>
  </div>

  <!-- xterm.js + fit addon (window.XtermLib), built by node bundle-xterm.js -->
  <script src="/xterm/xterm.bundle.js"></script>
  <!-- Helpers partagés avec les consoles graphiques, testés dans
       src/lib/console/viewport.test.ts puis bundlés par bundle-console.js. -->
  <script src="/console/console-ui.bundle.js"></script>

  <script>
    const statusDot = document.getElementById('status-dot');
    const nodeInfo = document.getElementById('node-info');
    const statusText = document.getElementById('status-text');
    const errorBar = document.getElementById('error-bar');
    const terminalDiv = document.getElementById('terminal');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loading-text');
    const loadingSubtext = document.getElementById('loading-subtext');
    const toolbar = document.getElementById('toolbar');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const btnReconnect = document.getElementById('btn-reconnect');
    const btnClose = document.getElementById('btn-close');

    const params = new URLSearchParams(window.location.search);
    const connId = params.get('connId');
    const node = params.get('node');

    let terminal = null;
    let fitAddon = null;
    let socket = null;

    // Le nœud en tête du libellé: c'est ce que la barre des tâches laisse voir
    // quand plusieurs shells sont ouverts côte à côte (issue #630, #879).
    function renderNodeLabel(host) {
      const label = node ? node + ' • Shell' : 'Shell';

      document.title = label;
      nodeInfo.textContent = host ? label + ' • ' + host : label;
    }

    renderNodeLabel(null);

    function setStatus(status, text) {
      statusDot.className = status;
      statusText.textContent = '• ' + text;
    }

    function showError(msg) {
      errorBar.textContent = msg;
      errorBar.classList.add('visible');
    }

    function hideError() {
      errorBar.classList.remove('visible');
    }

    // Le pty distant ne demande jamais sa taille: chaque changement de boîte
    // doit être renvoyé, sinon les lignes longues se replient de travers.
    function refit() {
      if (!fitAddon || !terminal) return;
      fitAddon.fit();
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send('1:' + terminal.cols + ':' + terminal.rows + ':');
      }
    }

    function initTerminal() {
      terminal = new XtermLib.Terminal({
        cursorBlink: true,
        cursorStyle: 'block',
        fontSize: 14,
        fontFamily: '"Cascadia Code", "Fira Code", "JetBrains Mono", Menlo, Monaco, "Courier New", monospace',
        theme: {
          background: '#0c0c0c',
          foreground: '#cccccc',
          cursor: '#ffffff',
          cursorAccent: '#000000',
          selectionBackground: '#264f78',
          black: '#0c0c0c',
          red: '#c50f1f',
          green: '#13a10e',
          yellow: '#c19c00',
          blue: '#0037da',
          magenta: '#881798',
          cyan: '#3a96dd',
          white: '#cccccc',
          brightBlack: '#767676',
          brightRed: '#e74856',
          brightGreen: '#16c60c',
          brightYellow: '#f9f1a5',
          brightBlue: '#3b78ff',
          brightMagenta: '#b4009e',
          brightCyan: '#61d6d6',
          brightWhite: '#f2f2f2'
        },
        allowProposedApi: true,
        scrollback: 10000,
      });

      fitAddon = new XtermLib.FitAddon();
      terminal.loadAddon(fitAddon);
      terminal.open(terminalDiv);
      fitAddon.fit();

      window.addEventListener('resize', refit);

      terminal.onData(function(data) {
        if (socket && socket.readyState === WebSocket.OPEN) {
          // Format Proxmox termproxy: 0:length:data
          socket.send('0:' + data.length + ':' + data);
        }
      });

      return terminal;
    }

    async function connect() {
      if (!connId || !node) {
        showError('Missing parameters: connId and node are required');
        setStatus('error', 'Error');
        loadingText.textContent = 'Error';

        return;
      }

      hideError();
      setStatus('connecting', 'Connecting...');
      loading.style.display = 'block';
      loadingText.textContent = 'Creating the session...';
      loadingSubtext.textContent = '';

      try {
        // Chaque fenêtre crée SA session termproxy: elles sont à usage unique
        // côté serveur, donc deux shells du même nœud ne se marchent pas dessus.
        const apiUrl = '/api/v1/connections/' + encodeURIComponent(connId) +
          '/nodes/' + encodeURIComponent(node) + '/terminal';
        const res = await fetch(apiUrl, { method: 'POST' });

        if (!res.ok) {
          let message = 'HTTP ' + res.status;
          try {
            const err = await res.json();
            if (err && err.error) message = err.error;
          } catch (e) { /* réponse non JSON: le code HTTP suffit */ }
          throw new Error(message);
        }

        const json = await res.json();
        const session = (json && json.data) || {};
        if (!session.sessionId) throw new Error('Invalid session');

        renderNodeLabel(session.host);
        loadingText.textContent = 'Connecting to the terminal...';

        if (!terminal) initTerminal();
        else terminal.clear();

        if (socket) {
          const previous = socket;
          socket = null;
          previous.close();
        }

        // Le navigateur ne reçoit qu'un sessionId; hôte, port, ticket et jeton
        // PVE restent côté serveur. En dev, next ne gère pas l'upgrade WS et
        // c'est ws-proxy.js sur 3001 qui répond.
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const isDev = window.location.port === '3000' && window.location.hostname === 'localhost';
        const wsHost = isDev ? 'localhost:3001' : window.location.host;
        const wsUrl = wsProtocol + '//' + wsHost + '/api/internal/ws/shell/' + encodeURIComponent(session.sessionId);

        const ws = new WebSocket(wsUrl, ['binary']);
        socket = ws;
        ws.binaryType = 'arraybuffer';

        ws.onopen = function() {
          loading.style.display = 'none';
          setStatus('connected', 'Connected');
          terminal.focus();
          setTimeout(refit, 100);
        };

        ws.onmessage = function(event) {
          if (event.data instanceof ArrayBuffer) {
            terminal.write(new TextDecoder().decode(event.data));
          } else if (typeof event.data === 'string') {
            terminal.write(event.data);
          } else if (event.data instanceof Blob) {
            event.data.text().then(function(text) { terminal.write(text); });
          }
        };

        ws.onclose = function(event) {
          // Une fermeture d'un socket déjà remplacé (Reconnect) ne doit pas
          // repeindre l'écran de la session vivante.
          if (socket !== ws) return;
          setStatus('', 'Disconnected');
          loading.style.display = 'block';
          loadingText.textContent = 'Disconnected';
          loadingSubtext.textContent = 'Click Reconnect';
          if (event.code !== 1000 && event.code !== 1005 && event.reason) {
            showError('Connection closed: ' + event.reason);
          }
        };

        ws.onerror = function() {
          if (socket !== ws) return;
          showError('WebSocket connection failed.');
          setStatus('error', 'Error');
        };
      } catch (err) {
        showError(err.message);
        setStatus('error', 'Error');
        loadingText.textContent = 'Error';
        loadingSubtext.textContent = err.message;
      }
    }

    // --- Plein écran --------------------------------------------------------
    function syncFullscreenUi() {
      const on = ConsoleUI.isFullscreen(document);

      document.body.classList.toggle('fs', on);
      btnFullscreen.classList.toggle('active', on);
      btnFullscreen.title = on ? 'Leave fullscreen' : 'Fullscreen';
      if (!on) toolbar.classList.remove('peek');
      // La boîte n'est mise en page qu'à la frame suivante.
      requestAnimationFrame(refit);
      if (terminal) terminal.focus();
    }

    if (!ConsoleUI.fullscreenSupported(document.documentElement)) {
      btnFullscreen.style.display = 'none';
    }

    btnFullscreen.addEventListener('click', function() {
      ConsoleUI.toggleFullscreen(document, document.documentElement);
    });

    ['fullscreenchange', 'webkitfullscreenchange', 'MSFullscreenChange'].forEach(function(evt) {
      document.addEventListener(evt, syncFullscreenUi);
    });

    // En plein écran la barre est hors écran: le bord haut la ramène.
    document.addEventListener('mousemove', function(e) {
      if (!document.body.classList.contains('fs')) return;
      toolbar.classList.toggle('peek', e.clientY <= 4);
    });

    btnReconnect.addEventListener('click', function() {
      connect();
    });

    btnClose.addEventListener('click', function() {
      if (socket) {
        const previous = socket;
        socket = null;
        previous.close();
      }
      window.close();
    });

    connect();
  </script>
</body>
</html>
